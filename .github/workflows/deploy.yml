name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: /api
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload release
        run: |
          aws s3 sync dist "s3://${{ vars.FE_DEPLOY_BUCKET }}/releases/${GITHUB_SHA}/dist" --delete
          aws s3 cp deploy/nginx/codeiary.conf "s3://${{ vars.FE_DEPLOY_BUCKET }}/releases/${GITHUB_SHA}/codeiary.conf"
      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          BUCKET: ${{ vars.FE_DEPLOY_BUCKET }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Codeiary FE ${GITHUB_SHA}" \
            --parameters commands="[
              \"set -eu\",
              \"aws s3 sync s3://${BUCKET}/releases/${GITHUB_SHA}/dist /var/www/codeiary --delete\",
              \"aws s3 cp s3://${BUCKET}/releases/${GITHUB_SHA}/codeiary.conf /etc/nginx/sites-available/codeiary\",
              \"ln -sfn /etc/nginx/sites-available/codeiary /etc/nginx/sites-enabled/codeiary\",
              \"rm -f /etc/nginx/sites-enabled/default\",
              \"nginx -t\",
              \"systemctl reload nginx\"
            ]" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
