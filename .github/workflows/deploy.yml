name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: public.ecr.aws
  REGISTRY_ALIAS: c6w0t5f3
  IMAGE_NAME: codeiary-fe-static

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: /api
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.static
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          IMAGE="${REGISTRY}/${REGISTRY_ALIAS}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          COMMAND_ID=$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Codeiary FE ${GITHUB_SHA}" \
            --parameters commands="[
              \"set -eu\",
              \"docker rm -f codeiary-fe-release >/dev/null 2>&1 || true\",
              \"docker pull ${IMAGE}\",
              \"docker create --name codeiary-fe-release ${IMAGE}\",
              \"find /var/www/codeiary -mindepth 1 -maxdepth 1 -exec rm -rf {} +\",
              \"docker cp codeiary-fe-release:/app/. /var/www/codeiary/\",
              \"docker cp codeiary-fe-release:/etc/codeiary/codeiary.conf /etc/nginx/sites-available/codeiary\",
              \"docker rm codeiary-fe-release\",
              \"ln -sfn /etc/nginx/sites-available/codeiary /etc/nginx/sites-enabled/codeiary\",
              \"rm -f /etc/nginx/sites-enabled/default\",
              \"nginx -t\",
              \"systemctl reload nginx\"
            ]" --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; exit 1 ;;
            esac
            sleep 10
          done
          echo "SSM command $COMMAND_ID did not finish within 10 minutes" >&2
          exit 1
