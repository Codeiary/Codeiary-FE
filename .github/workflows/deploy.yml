name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-static

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: /api
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.static
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          IMAGE_NAME_LOWER=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${IMAGE_NAME_LOWER}:sha-${GITHUB_SHA}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Codeiary FE ${GITHUB_SHA}" \
            --parameters commands="[
              \"set -eu\",
              \"docker pull ${IMAGE}\",
              \"docker create --name codeiary-fe-release ${IMAGE}\",
              \"find /var/www/codeiary -mindepth 1 -maxdepth 1 -exec rm -rf {} +\",
              \"docker cp codeiary-fe-release:/app/. /var/www/codeiary/\",
              \"docker cp codeiary-fe-release:/etc/codeiary/codeiary.conf /etc/nginx/sites-available/codeiary\",
              \"docker rm codeiary-fe-release\",
              \"ln -sfn /etc/nginx/sites-available/codeiary /etc/nginx/sites-enabled/codeiary\",
              \"rm -f /etc/nginx/sites-enabled/default\",
              \"nginx -t\",
              \"systemctl reload nginx\"
            ]" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
