server {
    listen 80;
    listen [::]:80;
    server_name codeiary.com www.codeiary.com;

    return 301 https://codeiary.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.codeiary.com;

    ssl_certificate /etc/letsencrypt/live/codeiary.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeiary.com/privkey.pem;

    return 301 https://codeiary.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codeiary.com;

    root /var/www/codeiary;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/codeiary.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeiary.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
